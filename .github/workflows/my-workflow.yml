name: System Info Test

on:
  workflow_dispatch:

jobs:
  system-info:
    runs-on: ubuntu-latest

    steps:
      - name: Print greeting
        run: echo "Hello Ganesh! GitHub Actions is running."

      - name: Show current date
        run: date

      - name: Show current directory
        run: pwd

      - name: List files
        run: ls -la

      - name: Show OS details
        run: uname -a